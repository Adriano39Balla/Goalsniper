<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goalsniper</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f14; --panel: #131a22; --panel2: #0e141b; --border: #24303c;
    --text: #e7edf3; --muted: #8ea0b3; --accent: #35d07f; --accent-dim: #1f6b46;
    --lean: #4b9bf2; --lean-dim: #1d3d63;
    --danger: #ff6b6b; --warn: #f2b84b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: 14px 18px; background: rgba(11,15,20,0.92); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
  }
  header .logo { font-size: 20px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; color: var(--muted); margin-left: auto; display: flex; align-items: center; gap: 6px; }
  header .build { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
                  color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  header a.logout { color: var(--muted); font-size: 12px; text-decoration: none; border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; }
  header a.logout:hover { color: var(--text); border-color: var(--muted); }

  main { max-width: 980px; margin: 0 auto; padding: 18px; }

  /* ---- horizontal scroll strips (day tabs, market chips) ---- */
  .hscroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .hscroll::-webkit-scrollbar { height: 5px; }
  .hscroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .day-tabs { margin-bottom: 14px; }
  .day-tab {
    flex: 0 0 auto; background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 6px 10px; text-align: center; border-radius: 8px; font: inherit;
  }
  .day-tab .dow { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; display: block; }
  .day-tab .dnum { font-size: 13px; font-weight: 600; display: block; margin-top: 2px; color: var(--text); }
  .day-tab.active { background: var(--panel); }
  .day-tab.active .dow, .day-tab.active .dnum { color: var(--accent); }
  .day-tab.active .dow::after { content: ''; display: block; width: 18px; height: 2px; background: var(--accent); margin: 4px auto 0; border-radius: 2px; }

  .chip-row { margin-bottom: 12px; }
  .chip {
    flex: 0 0 auto; background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 7px 14px; font-size: 12.5px; cursor: pointer; font: inherit; white-space: nowrap;
  }
  .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }

  .controls { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .controls .spacer { flex: 1; }
  .controls .updated { font-size: 12px; color: var(--muted); }
  .controls label { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
  .controls button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; font-size: 11.5px; cursor: pointer; font: inherit;
  }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat .value { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .stat .value.pos { color: var(--accent); }
  .stat .value.neg { color: var(--danger); }
  .pnl-caveat {
    font-size: 11.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--border);
    border-left: 3px solid var(--warn); border-radius: 8px; padding: 10px 12px; margin: -6px 0 16px;
  }
  .pnl-caveat b { color: var(--warn); font-weight: 600; }

  .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 24px 0 10px; }
  .section-title .stale { font-weight: 400; text-transform: none; letter-spacing: normal; color: var(--warn); margin-left: 8px; }

  table.market-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.market-table th, table.market-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  table.market-table th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  table.market-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.market-table td.hit { color: var(--accent); font-weight: 600; }
  .market-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }

  /* ---- strength tabs ---- */
  .strength-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .strength-tab {
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; font: inherit;
  }
  .strength-tab.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .strength-tab .n { font-weight: 400; opacity: 0.75; margin-left: 3px; }

  /* ---- league groups / feed cards ---- */
  .feed-section { margin-bottom: 26px; }
  .feed-section-head {
    display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--text);
    padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--border);
  }
  .feed-section-head .n {
    font-weight: 700; font-size: 11px; color: var(--bg); background: var(--muted);
    border-radius: 999px; padding: 1px 8px; letter-spacing: 0;
  }
  .live-pip {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 7px var(--accent); flex: 0 0 auto;
  }
  .section-note {
    color: var(--muted); font-size: 12.5px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px;
  }

  .league-group { margin-bottom: 18px; }
  .league-header { display: flex; align-items: center; gap: 8px; padding: 6px 2px; }
  .league-header .icon {
    width: 22px; height: 22px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 11px; flex: 0 0 auto;
  }
  .league-header .name { font-weight: 600; font-size: 13px; }
  .league-header .country { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

  .feed { display: flex; flex-direction: column; gap: 8px; }
  .feed-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .feed-row {
    display: grid; grid-template-columns: auto 1fr auto auto; gap: 4px 12px; align-items: center;
    padding: 12px 14px; cursor: pointer; user-select: none;
  }
  .feed-row:hover { background: var(--panel2); }
  .feed-row .kotime { font-size: 11px; color: var(--muted); text-align: center; min-width: 40px; }
  .feed-row .kotime .ko-label { display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .feed-row .kotime.live-now { color: var(--accent); font-weight: 700; }
  .feed-row .match { font-weight: 600; font-size: 14px; }
  .feed-row .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .feed-row .sub .pick { color: var(--text); }
  .conf { text-align: right; font-size: 18px; font-weight: 700; }
  .conf .pct { font-size: 11px; color: var(--muted); font-weight: 500; display: block; }
  .feed-row .caret { color: var(--muted); font-size: 11px; transition: transform 0.15s ease; }
  .feed-row.open .caret { transform: rotate(90deg); }

  .tag { display: inline-flex; align-items: center; font-size: 10px; font-weight: 700; letter-spacing: 0.03em;
         border-radius: 5px; padding: 3px 7px; text-transform: uppercase; margin-right: 6px; }
  .tag.strong { background: var(--accent); color: var(--bg); }
  .tag.leans { background: var(--lean-dim); color: var(--lean); }
  .tag.sent { background: var(--panel2); color: var(--muted); border: 1px solid var(--border); }
  .tag.unsent { background: var(--panel2); color: var(--warn); border: 1px solid var(--border); }

  .overview { border-top: 1px solid var(--border); padding: 12px 14px 14px; }
  .overview .meta-line { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .stat-grid { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 10px; }
  .stat-grid td { padding: 5px 4px; border-bottom: 1px solid var(--border); }
  .stat-grid td.num { text-align: right; font-variant-numeric: tabular-nums; width: 30%; }
  .stat-grid td.label { text-align: center; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  .form-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .form-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .form-card .head { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .form-card .headline { font-size: 13px; font-weight: 600; margin-top: 5px; line-height: 1.35; }
  .form-card .verdict { font-size: 11.5px; margin-top: 5px; }
  .form-card .verdict.good { color: var(--accent); }
  .form-card .verdict.bad { color: var(--warn); }
  .form-card .verdict.neutral { color: var(--muted); }
  .form-card .detail { font-size: 11px; color: var(--muted); margin-top: 5px; }
  .form-loading { font-size: 11.5px; color: var(--muted); margin-bottom: 10px; }

  .trust-line {
    display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text);
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; margin-top: 10px;
  }
  .trust-line.muted { color: var(--muted); }
  .trust-line .dot-accent { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }

  .empty, .error { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 13.5px; }
  .error { color: var(--danger); }
</style>
</head>
<body>
  <header>
    <div class="logo">⚽️</div>
    <h1>goalsniper</h1>
    <div class="status">
      <span class="build" id="build" title="Commit currently running"></span>
      <span class="dot" id="dot"></span><span id="statusText">connecting…</span>
    </div>
    <a class="logout" href="{{ url_for('dashboard_logout') }}"
       onclick="return confirm('Sign out?')">Sign out</a>
  </header>
  <main>
    <div class="hscroll day-tabs" id="dayTabs"></div>
    <div class="hscroll chip-row" id="chipRow"></div>

    <div class="stats" id="stats"></div>
    <div class="pnl-caveat" id="pnlCaveat" style="display:none"></div>
    <div class="section-title">Performance by market</div>
    <div class="market-wrap"><table class="market-table" id="marketTable"></table></div>

    <div class="section-title" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      Picks <span id="liveStale" class="stale"></span>
      <div class="spacer"></div>
      <div class="controls" style="margin:0;">
        <label><input type="checkbox" id="autoRefreshChk"> Auto-rescan (60s)</label>
        <button id="liveRefreshBtn" type="button">Refresh now</button>
        <div class="updated" id="updated">—</div>
      </div>
    </div>

    <div class="strength-tabs" id="strengthTabs"></div>
    <div class="feed" id="feed"><div class="empty">Loading…</div></div>
  </main>

<script>
const REFRESH_MS = {{ refresh_sec }} * 1000;
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const buildEl = document.getElementById('build');
const updated = document.getElementById('updated');
const statsEl = document.getElementById('stats');
const caveatEl = document.getElementById('pnlCaveat');
const marketTableEl = document.getElementById('marketTable');
const dayTabsEl = document.getElementById('dayTabs');
const chipRowEl = document.getElementById('chipRow');
const strengthTabsEl = document.getElementById('strengthTabs');
const feedEl = document.getElementById('feed');
const liveStaleEl = document.getElementById('liveStale');
const liveRefreshBtn = document.getElementById('liveRefreshBtn');
const autoRefreshChk = document.getElementById('autoRefreshChk');

// Per-viewer convenience only (selected day/market/strength, auto-rescan) -
// safe to lose if storage is unavailable (private window, cleared data).
function loadPref(key, fallback) {
  try { return localStorage.getItem(key) ?? fallback; } catch (e) { return fallback; }
}
function savePref(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* ignore */ }
}

autoRefreshChk.checked = loadPref('goalsniper.autoRescan', '0') === '1';

let lastTips = [];
let lastLive = null;
let selectedDayOffset = 0;      // 0 = today, 1 = yesterday, ... 6 = six days ago
let selectedMarket = 'All';
let selectedStrength = 'all';   // all | strong | leans
let autoRefreshTimer = null;
// Which match panels are expanded, by stable item key - survives the
// periodic redraw so a panel doesn't collapse mid-read.
const openKeys = new Set();

function fmtMoney(n) {
  if (n === null || n === undefined) return '—';
  const s = n >= 0 ? '+' : '';
  return s + n.toFixed(2) + 'u';
}
function fmtPct(n, digits=1) {
  if (n === null || n === undefined) return '—';
  return n.toFixed(digits) + '%';
}
function cls(n) { return n > 0 ? 'pos' : (n < 0 ? 'neg' : ''); }

function renderStats(pnl) {
  if (!pnl || pnl.error) {
    statsEl.innerHTML = '<div class="stat"><div class="label">P&amp;L</div><div class="value">unavailable</div></div>';
    marketTableEl.innerHTML = '';
    // Don't leave a caveat standing next to numbers that aren't there.
    caveatEl.style.display = 'none';
    return;
  }
  const cards = [
    ['Bets', pnl.n_bets ?? 0, ''],
    ['Win rate', fmtPct(pnl.win_rate_pct), ''],
    ['ROI', fmtPct(pnl.roi_pct), cls(pnl.roi_pct)],
    ['Profit', fmtMoney(pnl.total_profit), cls(pnl.total_profit)],
    ['Mean CLV', pnl.mean_clv_pct != null ? fmtPct(pnl.mean_clv_pct) : '—', cls(pnl.mean_clv_pct || 0)],
  ];
  statsEl.innerHTML = cards.map(([label, value, c]) =>
    `<div class="stat"><div class="label">${label}</div><div class="value ${c}">${value}</div></div>`
  ).join('');

  // Say why the record looks short, rather than leaving a near-empty P&L
  // looking like a bug. The excluded bets were graded at prices that were
  // never available for the selection, so they are not a track record.
  const stale = pnl.excluded_unreliable_pricing;
  caveatEl.innerHTML = (stale && stale.n_bets)
    ? `<b>${stale.n_bets} earlier bets excluded.</b> They were priced off contaminated market
       data (team totals and half markets folded into the full-match markets), which is where
       the old ${fmtPct(stale.roi_pct)} ROI / ${fmtMoney(stale.total_profit)} came from. Those
       prices were never available for the selection, so they are not a track record. The
       figures above cover bets priced since the fix.`
    : '';
  caveatEl.style.display = (stale && stale.n_bets) ? 'block' : 'none';

  const rows = Object.entries(pnl.by_market || {});
  if (!rows.length) {
    marketTableEl.innerHTML = '<tr><td style="padding:14px;color:var(--muted)">No graded bets in this window yet.</td></tr>';
    return;
  }
  marketTableEl.innerHTML = `
    <tr><th>Market</th><th class="num">Bets</th><th class="num">Win %</th><th class="num">ROI</th><th class="num">Profit</th></tr>
    ${rows.map(([mkt, d]) => `
      <tr>
        <td>${mkt}</td>
        <td class="num">${d.bets}</td>
        <td class="num">${fmtPct(d.win_rate_pct)}</td>
        <td class="num" style="color:var(--${d.roi_pct >= 0 ? 'accent' : 'danger'})">${fmtPct(d.roi_pct)}</td>
        <td class="num">${fmtMoney(d.profit)}</td>
      </tr>`).join('')}
  `;
}

function topProb(m) {
  return (m.markets || []).reduce((max, mk) => Math.max(max, mk.prob_pct || 0), 0);
}

// Mirrors the decision codes _price_gate() / _build_live_match_entry() can
// set in main.py - keep in sync if a new decision code is added there.
const DECISION_LABELS = {
  below_threshold: 'Below threshold',
  tipped: 'Tipped',
  no_odds: 'No odds available',
  odds_out_of_range: 'Odds out of range',
  no_fair_price: 'No fair price yet',
  too_few_books: 'Too few books quoting',
  ev_below_min: 'EV too low',
  fair_edge_below_min: 'Edge vs. market too small',
  edge_implausible: 'Edge too large — suppressed',
  correlated_with_existing_tip: 'Correlated with another tip',
  per_match_cap: 'Per-match tip cap reached',
  unmapped_market: 'Unmapped market',
  overround_too_wide: 'Market too wide to trust',
  // inplay_data_gate() - not enough real observation to bet on yet.
  too_early: 'Too early to bet',
  xg_feed_dead: 'xG feed missing — not bettable',
  no_shot_data: 'No shot data — feed looks dead',
  too_late: 'Past the model\u2019s training range',
  market_already_settled: 'Full-time market already settled',
  head_suppressed: 'Model head suppressed — not fit to bet',
};
function decisionLabel(code) { return DECISION_LABELS[code] || code || '—'; }

// ---- day tabs (today + 6 days back - the window Goalsniper actually has
// data for: live matches happen "now", prematch scanning is currently
// paused so there's nothing to show for future days) ----
const DOW = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
function dateForOffset(offset) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - offset);
  return d;
}
function sameLocalDay(ts, offset) {
  const d = new Date(ts * 1000);
  const target = dateForOffset(offset);
  return d.getFullYear() === target.getFullYear() && d.getMonth() === target.getMonth() && d.getDate() === target.getDate();
}
function renderDayTabs() {
  const offsets = [6, 5, 4, 3, 2, 1, 0];
  dayTabsEl.innerHTML = offsets.map(off => {
    const d = dateForOffset(off);
    const label = off === 0 ? 'TODAY' : DOW[d.getDay()];
    const dnum = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.`;
    return `<button class="day-tab${off === selectedDayOffset ? ' active' : ''}" data-off="${off}">
      <span class="dow">${label}</span><span class="dnum">${dnum}</span>
    </button>`;
  }).join('');
  dayTabsEl.querySelectorAll('.day-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedDayOffset = parseInt(btn.dataset.off, 10);
      renderDayTabs();
      renderFeed();
    });
  });
  // Today sits at the right-hand end, which on a phone is off-screen in the
  // scroll strip - so the selected day wasn't visible at all. Bring it in.
  const active = dayTabsEl.querySelector('.day-tab.active');
  if (active && active.scrollIntoView) {
    active.scrollIntoView({ block: 'nearest', inline: 'center' });
  }
}

// ---- feed items: a live match or a historical tip, normalised just enough
// to share filtering/sorting/grouping logic ----
function buildDayItems(offset) {
  const items = [];
  if (offset === 0 && lastLive) {
    for (const m of (lastLive.matches || [])) {
      items.push({ type: 'live', league: m.league || 'Unknown league', sortTs: m.kickoff_ts || 0, data: m });
    }
  }
  const liveFids = new Set(items.map(it => it.data.fixture_id));
  for (const t of lastTips) {
    if (!sameLocalDay(t.created_ts, offset)) continue;
    // Skip a historical tip for a fixture that's shown live right now -
    // the live card already reflects that market as "tipped".
    if (offset === 0 && liveFids.has(t.match_id)) continue;
    items.push({ type: 'tip', league: t.league || 'Unknown league', sortTs: t.created_ts, data: t });
  }
  return items;
}

function itemMarkets(it) {
  return it.type === 'live' ? (it.data.markets || []).map(mk => mk.market) : [it.data.market];
}
function itemStrength(it) {
  if (it.type === 'tip') return 'strong';
  const markets = it.data.markets || [];
  if (markets.some(mk => mk.decision === 'tipped')) return 'strong';
  if (markets.some(mk => mk.prob_pct >= mk.threshold_pct)) return 'leans';
  return 'none';
}

function renderChips() {
  const dayItems = buildDayItems(selectedDayOffset);
  const priority = ['1X2', 'Double Chance', 'Draw No Bet', 'BTTS', 'Over/Under 2.5', 'Over/Under 3.5'];
  const seen = new Set();
  dayItems.forEach(it => itemMarkets(it).forEach(m => seen.add(m)));
  const ordered = priority.filter(m => seen.has(m));
  [...seen].filter(m => !priority.includes(m)).sort().forEach(m => ordered.push(m));
  const chips = ['All', ...ordered];
  if (!ordered.includes(selectedMarket)) selectedMarket = 'All';

  chipRowEl.innerHTML = chips.map(m =>
    `<button class="chip${m === selectedMarket ? ' active' : ''}" data-m="${m}">${m}</button>`
  ).join('');
  chipRowEl.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedMarket = btn.dataset.m;
      renderChips();
      renderFeed();
    });
  });
}

function renderStrengthTabs(dayItems) {
  const marketFiltered = selectedMarket === 'All'
    ? dayItems
    : dayItems.filter(it => itemMarkets(it).includes(selectedMarket));
  const counts = { all: marketFiltered.length, strong: 0, leans: 0 };
  marketFiltered.forEach(it => {
    const s = itemStrength(it);
    if (s === 'strong') counts.strong++;
    else if (s === 'leans') counts.leans++;
  });
  const tabs = [['all', 'All'], ['leans', 'Leans+'], ['strong', 'Strong']];
  strengthTabsEl.innerHTML = tabs.map(([key, label]) =>
    `<button class="strength-tab${key === selectedStrength ? ' active' : ''}" data-k="${key}">
      ${label}<span class="n">${counts[key === 'leans' ? 'leans' : (key === 'strong' ? 'strong' : 'all')]}</span>
    </button>`
  ).join('');
  strengthTabsEl.querySelectorAll('.strength-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedStrength = btn.dataset.k;
      renderFeed();
    });
  });
}

// ---- form & momentum (lazy: costs two API-Football calls per uncached
// fixture, so it's fetched only when a match is actually opened, and kept
// in formCache so re-opening it - including after an auto-refresh redraw -
// is free) ----
const formCache = new Map();

function formCard(c) {
  if (!c) return '';
  const venueWord = c.venue === 'home' ? 'home' : 'away';
  if (!c.played) {
    return `<div class="form-card">
        <div class="head">Form &amp; momentum</div>
        <div class="headline">${c.team}</div>
        <div class="verdict neutral">no recent ${venueWord} games on record</div>
      </div>`;
  }
  const verdict = c.verdict
    ? `<div class="verdict ${c.verdict.tone}">${c.verdict.text}</div>`
    : `<div class="verdict neutral">too few ${venueWord} games to compare</div>`;
  return `<div class="form-card">
      <div class="head">Form &amp; momentum</div>
      <div class="headline">${c.team} win ${c.win_pct.toFixed(0)}% of their ${venueWord} games</div>
      ${verdict}
      <div class="detail">last ${c.played} ${venueWord} (recency-weighted) ·
        ${c.goals_for.toFixed(1)} scored / ${c.goals_against.toFixed(1)} conceded ·
        league average ${c.league_win_pct.toFixed(0)}%</div>
    </div>`;
}

function renderFormInto(host, data) {
  if (!data || !data.available) {
    host.innerHTML = `<div class="form-loading">Form unavailable${data && data.reason ? ' — ' + data.reason : ''}.</div>`;
    return;
  }
  host.innerHTML = `<div class="form-cards">${formCard(data.home)}${formCard(data.away)}</div>`;
}

const FORM_URL_TEMPLATE = '{{ url_for("dashboard_match_form", fid=0) }}';
function formUrl(fid) { return FORM_URL_TEMPLATE.replace('/0/', '/' + fid + '/'); }

async function loadForm(fid, detailId) {
  const host = document.querySelector('#' + detailId + ' .form-slot');
  if (!host || host.dataset.loaded === '1') return;
  if (formCache.has(fid)) {
    host.dataset.loaded = '1';
    renderFormInto(host, formCache.get(fid));
    return;
  }
  host.innerHTML = '<div class="form-loading">Loading form…</div>';
  try {
    const r = await fetch(formUrl(fid), { credentials: 'same-origin' });
    if (r.status === 401) { window.location.href = '{{ url_for("dashboard_login") }}'; return; }
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'form lookup failed');
    formCache.set(fid, data);
    host.dataset.loaded = '1';
    renderFormInto(host, data);
  } catch (e) {
    host.innerHTML = `<div class="form-loading">Form unavailable — ${e.message}</div>`;
  }
}

function fmtClock(ts) {
  if (!ts) return null;
  return new Date(ts * 1000).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

function statRow(label, h, a, unit) {
  return `<tr><td class="num">${h}${unit}</td><td class="label">${label}</td><td class="num">${a}${unit}</td></tr>`;
}

function overviewForLive(m) {
  const ko = m.kickoff_ts ? `Kickoff ${fmtClock(m.kickoff_ts)} · ` : '';
  const marketRows = (m.markets || []).map(mk => {
    const tag = mk.decision === 'tipped' ? '<span class="tag strong">Strong</span>'
      : (mk.prob_pct >= mk.threshold_pct ? '<span class="tag leans">Leans+</span>' : '');
    return `
      <tr>
        <td>${tag}${mk.market}</td>
        <td>${mk.suggestion}</td>
        <td class="num${mk.decision === 'tipped' ? ' hit' : ''}">${mk.prob_pct.toFixed(1)}%</td>
        <td class="num" style="color:var(--muted)">${mk.threshold_pct.toFixed(1)}%</td>
        <td style="color:${mk.decision === 'tipped' ? 'var(--accent)' : 'var(--muted)'}">${decisionLabel(mk.decision)}${mk.odds ? ` @ ${mk.odds.toFixed(2)}` : ''}</td>
      </tr>`;
  }).join('');

  let statsGrid = '';
  if (m.stats) {
    const s = m.stats;
    statsGrid = `<table class="stat-grid">
      ${statRow('Shots on target', s.sot_h ?? 0, s.sot_a ?? 0, '')}
      ${statRow('Corners', s.cor_h ?? 0, s.cor_a ?? 0, '')}
      ${statRow('Possession', Math.round(s.pos_h ?? 0), Math.round(s.pos_a ?? 0), '%')}
      ${statRow('Yellow cards', s.yellow_h ?? 0, s.yellow_a ?? 0, '')}
    </table>`;
  }

  const hits = m.hits || 0;
  const trust = hits > 0
    ? `<div class="trust-line"><span class="dot-accent"></span>Prediction Model · ${topProb(m).toFixed(1)}% confidence on the leading pick</div>`
    : `<div class="trust-line muted">No pick has cleared the price gate yet this scan.</div>`;

  return `
    <div class="overview">
      <div class="meta-line">${ko}Score ${m.score || '0-0'} · ${m.minute}' played</div>
      <div class="form-slot"></div>
      ${statsGrid}
      <table class="market-table">
        <tr><th>Market</th><th>Selection</th><th class="num">Prob</th><th class="num">Threshold</th><th>Status</th></tr>
        ${marketRows || '<tr><td colspan="5" style="padding:14px;color:var(--muted)">No candidate markets this scan.</td></tr>'}
      </table>
      ${trust}
    </div>`;
}

function overviewForTip(t) {
  const when = new Date(t.created_ts * 1000).toLocaleString(undefined, {
    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
  });
  const badge = t.is_prematch ? 'PREMATCH' : `LIVE ${t.minute ?? ''}'`;
  const odds = t.odds ? `@ ${t.odds.toFixed(2)}${t.book ? ' (' + t.book + ')' : ''}` : 'no price';
  const ev = t.ev_pct != null ? `EV ${t.ev_pct > 0 ? '+' : ''}${t.ev_pct.toFixed(1)}%` : '—';
  const fair = t.fair_prob != null ? fmtPct(t.fair_prob * 100) : '—';
  const stake = t.stake_units ? `${t.stake_units.toFixed(2)}u` : '—';
  const clv = t.clv_pct != null ? fmtPct(t.clv_pct) : 'not captured yet';
  const delivered = t.sent_ok === 0 ? '<span class="tag unsent">Not delivered</span>' : '<span class="tag sent">Delivered</span>';

  return `
    <div class="overview">
      <div class="meta-line">${badge} · ${when} · score at tip ${t.score_at_tip || '—'}</div>
      <table class="stat-grid">
        <tr><td>Odds</td><td class="num">${odds}</td></tr>
        <tr><td>EV</td><td class="num">${ev}</td></tr>
        <tr><td>Fair price</td><td class="num">${fair}</td></tr>
        <tr><td>Stake</td><td class="num">${stake}</td></tr>
        <tr><td>Closing line value</td><td class="num">${clv}</td></tr>
        <tr><td>Delivery</td><td class="num">${delivered}</td></tr>
      </table>
      <div class="trust-line"><span class="dot-accent"></span>Prediction Model · ${t.confidence != null ? t.confidence.toFixed(1) : '—'}% confidence · Tipped</div>
    </div>`;
}

// An empty feed has several very different causes and the old catch-all
// message covered all of them equally badly. Say which one it is.
function emptyReason(dayItems) {
  if (dayItems.length) {
    return 'No picks match the current market / strength filter — '
         + `${dayItems.length} hidden. Try "All".`;
  }
  if (selectedDayOffset !== 0) {
    return 'No tips were sent on this day. (Live matches only appear on Today.)';
  }
  const seen = lastLive && lastLive.live_seen;
  const uncovered = lastLive && lastLive.no_coverage;
  if (seen === 0) return 'No matches are being played right now.';
  if (seen > 0) {
    const why = uncovered
      ? `${uncovered} of them have no usable stats feed yet`
      : 'none of them have usable stats yet';
    return `${seen} live ${seen === 1 ? 'match' : 'matches'} in progress, but ${why} — `
         + 'nothing can be scored until the stats feed fills in (usually a few minutes in).';
  }
  return 'No live matches scored yet. If this persists, the scan may not have run since the last restart.';
}

// Keys are derived from the item itself, not its position, so an open panel
// survives the periodic redraw instead of snapping shut while it's read.
function itemKey(it) {
  return it.type === 'live'
    ? 'live-' + it.data.fixture_id
    : 'tip-' + it.data.match_id + '-' + it.data.created_ts;
}

function cardHtml(it) {
  const key = itemKey(it);
  const id = 'detail-' + key;
  if (it.type === 'live') {
    const m = it.data;
    const tag = m.hits > 0 ? '<span class="tag strong">Strong</span>'
      : (itemStrength(it) === 'leans' ? '<span class="tag leans">Leans+</span>' : '');
    return `
      <div class="feed-card">
        <div class="feed-row" data-id="${id}" data-key="${key}" data-fid="${m.fixture_id}">
          <div class="kotime live-now"><span class="ko-label">Live</span>${m.minute}'</div>
          <div>
            <div class="match">${tag}${m.home} vs ${m.away}</div>
            <div class="sub">${m.score || ''}</div>
          </div>
          <div class="conf">${topProb(m).toFixed(0)}%<span class="pct">top pick</span></div>
          <div class="caret">&#9656;</div>
        </div>
        <div id="${id}" style="display:none">${overviewForLive(m)}</div>
      </div>`;
  }
  const t = it.data;
  const ko = t.created_ts ? fmtClock(t.created_ts) : '—';
  return `
    <div class="feed-card">
      <div class="feed-row" data-id="${id}" data-key="${key}">
        <div class="kotime"><span class="ko-label">Sent</span>${ko}</div>
        <div>
          <div class="match"><span class="tag strong">Strong</span>${t.home} vs ${t.away}</div>
          <div class="sub"><span class="pick">${t.suggestion}</span> · ${t.market}</div>
        </div>
        <div class="conf">${t.confidence != null ? t.confidence.toFixed(0) : '—'}%<span class="pct">confidence</span></div>
        <div class="caret">&#9656;</div>
      </div>
      <div id="${id}" style="display:none">${overviewForTip(t)}</div>
    </div>`;
}

function leagueGroupsHtml(items) {
  const groups = new Map();
  items.forEach(it => {
    if (!groups.has(it.league)) groups.set(it.league, []);
    groups.get(it.league).push(it);
  });
  return [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([league, groupItems]) => {
    const [country, name] = league.includes(' - ') ? league.split(' - ') : ['', league];
    return `
      <div class="league-group">
        <div class="league-header">
          <div class="icon">⚽</div>
          <div>
            <div class="name">${name}</div>
            ${country ? `<div class="country">${country}</div>` : ''}
          </div>
        </div>
        <div class="feed">${groupItems.map(cardHtml).join('')}</div>
      </div>`;
  }).join('');
}

function renderFeed() {
  const dayItems = buildDayItems(selectedDayOffset);
  renderStrengthTabs(dayItems);

  let items = dayItems;
  if (selectedMarket !== 'All') items = items.filter(it => itemMarkets(it).includes(selectedMarket));
  if (selectedStrength !== 'all') items = items.filter(it => itemStrength(it) === selectedStrength);

  // Live and sent are separate sections, NOT one alphabetical list. Merging
  // them meant a single in-play match sat somewhere inside 55 prematch tips
  // sorted by country - present, but invisible, which reads as "live is
  // missing". In-play is the thing being watched: it goes first, always
  // shown with its own count, and says so even when the count is zero.
  const live = items.filter(it => it.type === 'live')
                    .sort((a, b) => (a.sortTs || Infinity) - (b.sortTs || Infinity));
  const sent = items.filter(it => it.type === 'tip')
                    .sort((a, b) => b.sortTs - a.sortTs);

  const liveSection = selectedDayOffset !== 0 ? '' : `
    <div class="feed-section">
      <div class="feed-section-head">
        <span class="live-pip"></span>Live now
        <span class="n">${live.length}</span>
      </div>
      ${live.length ? leagueGroupsHtml(live)
                    : `<div class="section-note">${emptyReason(dayItems.filter(it => it.type === 'live'))}</div>`}
    </div>`;

  const sentSection = sent.length ? `
    <div class="feed-section">
      <div class="feed-section-head">Sent tips <span class="n">${sent.length}</span></div>
      ${leagueGroupsHtml(sent)}
    </div>` : '';

  if (!liveSection && !sentSection) {
    feedEl.innerHTML = `<div class="empty">${emptyReason(dayItems)}</div>`;
    return;
  }

  feedEl.innerHTML = liveSection + sentSection;
  feedEl.querySelectorAll('.feed-row').forEach(row => {
    // Reopen whatever was open before this redraw. Form comes from
    // formCache here, so restoring costs no API call.
    if (openKeys.has(row.dataset.key)) {
      document.getElementById(row.dataset.id).style.display = 'block';
      row.classList.add('open');
      if (row.dataset.fid) loadForm(row.dataset.fid, row.dataset.id);
    }
    row.addEventListener('click', () => {
      const detail = document.getElementById(row.dataset.id);
      const open = detail.style.display !== 'none';
      detail.style.display = open ? 'none' : 'block';
      row.classList.toggle('open', !open);
      if (open) {
        openKeys.delete(row.dataset.key);
      } else {
        openKeys.add(row.dataset.key);
        if (row.dataset.fid) loadForm(row.dataset.fid, row.dataset.id);
      }
    });
  });
}

async function refresh() {
  const dataUrl = '{{ url_for("dashboard_data") }}?limit=200&days=30';
  const liveUrl = '{{ url_for("dashboard_live") }}';
  try {
    const [dataRes, liveRes] = await Promise.all([
      fetch(dataUrl, { credentials: 'same-origin' }),
      fetch(liveUrl, { credentials: 'same-origin' }),
    ]);
    if (dataRes.status === 401 || liveRes.status === 401) {
      window.location.href = '{{ url_for("dashboard_login") }}';
      return;
    }
    const data = await dataRes.json();
    if (!data.ok) throw new Error(data.error || 'unknown error');
    renderStats(data.pnl);
    lastTips = data.tips || [];
    // Which commit is actually serving this page - a push that never
    // deployed looks exactly like a change that didn't work.
    if (data.build) {
      buildEl.textContent = data.build.commit || 'unknown';
      buildEl.title = 'Running commit ' + (data.build.commit_full || 'unknown')
        + (data.build.branch ? ' on ' + data.build.branch : '');
    }

    const live = await liveRes.json();
    if (live.ok) {
      lastLive = live;
      if (live.updated_ts) {
        const ageSec = (Date.now() / 1000) - live.updated_ts;
        liveStaleEl.textContent = ageSec > 600
          ? `· last scan ${Math.round(ageSec / 60)} min ago — scheduler may be stuck` : '';
      }
    }

    renderChips();
    renderFeed();

    dot.classList.add('live');
    statusText.textContent = 'live';
    updated.textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    dot.classList.remove('live');
    statusText.textContent = 'connection issue';
    feedEl.innerHTML = `<div class="error">Could not load data: ${e.message}</div>`;
  }
}

async function refreshLiveNow() {
  liveRefreshBtn.disabled = true;
  const prevLabel = liveRefreshBtn.textContent;
  liveRefreshBtn.textContent = 'Scanning…';
  try {
    const r = await fetch('{{ url_for("dashboard_live_refresh") }}', {
      method: 'POST', credentials: 'same-origin',
    });
    if (r.status === 401) { window.location.href = '{{ url_for("dashboard_login") }}'; return; }
    const live = await r.json();
    if (!live.ok) throw new Error(live.error || 'refresh failed');
    lastLive = live;
    renderChips();
    renderFeed();
    updated.textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    feedEl.innerHTML = `<div class="error">Could not refresh: ${e.message}</div>`;
  } finally {
    liveRefreshBtn.disabled = false;
    liveRefreshBtn.textContent = prevLabel;
  }
}

function setAutoRefresh(on) {
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
  if (on) autoRefreshTimer = setInterval(refreshLiveNow, 60000);
}

liveRefreshBtn.addEventListener('click', refreshLiveNow);
autoRefreshChk.addEventListener('change', () => {
  savePref('goalsniper.autoRescan', autoRefreshChk.checked ? '1' : '0');
  setAutoRefresh(autoRefreshChk.checked);
});
setAutoRefresh(autoRefreshChk.checked);

renderDayTabs();
refresh();
setInterval(refresh, REFRESH_MS);
</script>
