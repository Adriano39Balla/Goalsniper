<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goalsniper</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f14; --panel: #131a22; --border: #24303c;
    --text: #e7edf3; --muted: #8ea0b3; --accent: #35d07f; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 340px; margin: 16px; padding: 28px 24px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  }
  .logo { font-size: 28px; text-align: center; margin-bottom: 4px; }
  h1 { font-size: 17px; text-align: center; margin: 0 0 22px; color: var(--muted); font-weight: 500; }
  input {
    width: 100%; padding: 11px 12px; background: #0e141b; border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 15px; margin-bottom: 12px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; padding: 11px; background: var(--accent); border: none; border-radius: 8px;
    color: #06110b; font-weight: 600; font-size: 15px; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .err {
    color: var(--danger); font-size: 13px; text-align: center; margin: -6px 0 14px;
  }
</style>
</head>
<body>
  <form class="card" method="POST" action="{{ url_for('dashboard_login') }}">
    <div class="logo">⚽️</div>
    <h1>goalsniper</h1>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="password" name="key" placeholder="Admin key" autofocus autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
