version: 1
build:
  builder: NIXPACKS
  buildCommand: pip install -r requirements.txt
deploy:
  startCommand: gunicorn main:app --bind 0.0.0.0:${PORT:-8000}
  healthcheckPath: /health
  healthcheckTimeout: 30
  restartPolicy:
    maxRetries: 3
    delay: 10s
  env:
    - name: DATABASE_URL
    - name: API_KEY
    - name: ADMIN_API_KEY
    - name: TELEGRAM_BOT_TOKEN
    - name: TELEGRAM_CHAT_ID
    - name: TELEGRAM_WEBHOOK_SECRET
    - name: ENVIRONMENT
      value: production
